packages:
  - .
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  netlify-cli: true
  sharp: true
  unix-dgram: true

catalog:
  '@antfu/eslint-config': 9.3.0
  '@eslint-react/eslint-plugin': 5.18.6
  '@sanity/document-internationalization': 6.2.30
  '@sanity/icons': 5.2.1
  '@sanity/structure': 2.36.2
  '@sanity/ui': 4.0.3
  '@sanity/vision': 6.9.2
  '@types/react': 19.2.18
  '@types/styled-components': 5.1.36
  eslint: 10.8.1
  eslint-plugin-react-refresh: ^0.5.3
  netlify-cli: 27.1.1
  react: 19.2.8
  react-dom: 19.2.8
  react-is: 19.2.8
  sanity: 6.9.2
  sanity-plugin-media: 6.1.3
  styled-components: 6.5.2
  typescript: 6.0.3

minimumReleaseAgeExclude:
  - smol-toml@1.6.1
  - esbuild@0.28.1
  - tar@7.5.16
  - dompurify@3.4.6 || 3.4.7 || 3.4.8 || 3.4.9 || 3.4.11
  - '@opentelemetry/core@2.8.0'
  - http-proxy-middleware@3.0.6 || 3.0.7
  - js-yaml@4.1.2
  - json-2-csv@5.5.11
  - adm-zip@0.6.0

overrides:
  '@fastify/static': '>=10.1.2'
  brace-expansion: '>=5.0.9'
  js-yaml: '>=5.2.2'
  minimatch: '>=9.0.6'
  path-to-regexp: '>=8.4.0'
  uuid: '>=13.0.1'
  tmp: '>=0.2.6'
  form-data: '>=4.0.6'
  undici: '>=7.29.0 <8.0.0'
  adm-zip: '>=0.6.0'
  '@opentelemetry/core': '>=2.8.0'
  smol-toml: '>=1.6.1'
  esbuild: '>=0.28.1'
  fast-uri: '>=3.1.5'
  postcss: '>=8.5.23'
  find-my-way: '>=9.7.0'
  sharp: '>=0.35.0'
  svgo: '>=4.0.2'
  body-parser: '>=2.3.0'
  tar: '>=7.5.21'
  linkify-it: '>=5.0.2 <6.0.0'

shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - '@netlify/*'
  - chokidar
  - groq
  - semver
  - '@sanity/client'
  - '@sanity/migrate'
  - groq-js
